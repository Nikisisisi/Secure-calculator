rules:
  - id: calculator-unbounded-power-operation
    message: >
      Power endpoint uses generic CalculationRequest without bounds
      for the exponent. Use a dedicated validated request model with
      a bounded integer exponent.
    severity: WARNING

    languages:
      - python

    metadata:
      category: security
      technology:
        - fastapi
      cwe:
        - "CWE-400: Uncontrolled Resource Consumption"
      owasp:
        - "API4:2023 Unrestricted Resource Consumption"
      project: secure-calculator

    patterns:
      - pattern-inside: |
          def power($DATA: CalculationRequest):
              ...

      - pattern: $DATA.a ** $DATA.b

  - id: calculator-unbounded-factorial-operation
    message: >
      Factorial endpoint must use a dedicated FactorialRequest
      model with strict integer validation and an upper bound.
    severity: WARNING

    languages:
      - python

    metadata:
      category: security
      cwe:
        - "CWE-400: Uncontrolled Resource Consumption"
      project: secure-calculator

    patterns:
      - pattern-inside: |
          def factorial($DATA: $MODEL):
              ...

      - pattern-not-inside: |
          def factorial($DATA: FactorialRequest):
              ...

      - pattern: $DATA.n
