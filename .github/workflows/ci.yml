name: Secure Calculator CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Bump application version
        run: python scripts/bump_version.py

      - name: Read new version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m pytest

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Install Semgrep
        run: python -m pip install semgrep==1.179.0

      - name: Run Semgrep security rules
        run: semgrep scan --config security/semgrep-rules.yml --error app

      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git \
            --config /repo/.gitleaks.toml \
            --redact \
            /repo

      - name: Scan Docker configuration with Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            aquasec/trivy:0.75.0 \
            config \
            --exit-code 1 \
            /repo

      - name: Build Docker image
        run: |
          docker build \
            -t secure-calculator:${{ steps.version.outputs.version }} \
            .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            secure-calculator:${{ steps.version.outputs.version }}

      - name: Commit new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION README.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push
