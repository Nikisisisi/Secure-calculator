<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Secure Calculator</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>


<body>

<div class="calculator">

    <h1> Secure Calculator</h1>

    <div class="author">
        Автор: Обухов Н. и Лапшина Д.
    </div>

<label for="a" class="sr-only">Первое число</label>

    <input
        id="a"
        type="number"
        step="any"
        placeholder="Первое число"
    >

<label for="b" class="sr-only">Второе число</label>

    <input
        id="b"
        type="number"
        step="any"
        placeholder="Второе число"
    >

    <div class="buttons">

    <button type="button" data-operation="add">
        +
    </button>

    <button type="button" data-operation="subtract">
        −
    </button>

    <button type="button" data-operation="multiply">
        ×
    </button>

    <button type="button" data-operation="divide">
        ÷
    </button>

    <button type="button" data-operation="power">
        ^
    </button>

    <button type="button" data-operation="factorial">
        !
    </button>

    <button type="button" data-constant="pi" title="Вставить число Пи">
        π
    </button>

    <button type="button" data-constant="e" title="Вставить число Эйлера">
        e
    </button>

    <button type="button" data-operation="sqrt" title="Квадратный корень из первого числа">
       √x
    </button>

</div>

    <div id="result" aria-live="polite">
        Результат: —
    </div>

    <div class="version" id="version">
        Secure Calculator API
    </div>

</div>


<script src="/static/script.js"></script>

</body>

</html>
